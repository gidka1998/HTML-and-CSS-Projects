<!DOCTYPE html>
<html>
<head>
    <title>Travel Adventures</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="one_page_website.css">
 <style>
        
    </style>
</head>

<body>

<!-- NAVIGATION -->
<nav>
    <a href="#home">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#video">Video</a>
    <a href="#contact">Contact</a>
</nav>

<!-- HOME SECTION -->
<section id="home">
    <h1>Travel Adventures</h1>
    <p>Discover amazing places around the world and plan your next trip!</p>
</section>

<h2 style="text-align:center" id="gallery">Gallery</h2>
<!-- Gallery -->
<div class="row">
  <div class="column">
    <img src="images/beach_sunset.avif" style="width:100%" onclick="openModal();currentSlide(1)" class="hover-shadow">
  </div>
  <div class="column">
    <img src="images/city_skyline.jpg" style="width:100%" onclick="openModal();currentSlide(2)" class="hover-shadow">
  </div>
  <div class="column">
    <img src="images/mountain-view.jpg" style="width:100%" onclick="openModal();currentSlide(3)" class="hover-shadow">
  </div>
  <div class="column">
    <img src="images/national.avif" style="width:100%" onclick="openModal();currentSlide(4)" class="hover-shadow">
  </div>
  <div class="column">
    <img src="images/train.avif" style="width:100%" onclick="openModal();currentSlide(4)" class="hover-shadow">
  </div>
  <div class="column">
    <img src="images/city.jpg" style="width:100%" onclick="openModal();currentSlide(4)" class="hover-shadow">
  </div>
  <div class="column">
    <img src="images/travel-destinations.jpeg" style="width:100%" onclick="openModal();currentSlide(4)" class="hover-shadow">
  </div>
</div>


<!-- Modal / Lightbox -->
<div id="myModal" class="modal">

  <span class="close cursor" onclick="closeModal()">&times;</span>

  <div class="modal-content">

    <!-- Slides -->
    <div class="mySlides">
      <div class="numbertext">1 / 7</div>
      <img src="images/beach_sunset.avif" style="width:100%">
    </div>

    <div class="mySlides">
      <div class="numbertext">2 / 7</div>
      <img src="images/city_skyline.jpg" style="width:100%">
    </div>

    <div class="mySlides">
      <div class="numbertext">3 / 7</div>
      <img src="images/mountain-view.jpg" style="width:100%">
    </div>

    <div class="mySlides">
      <div class="numbertext">4 / 7</div>
      <img src="images/national.avif" style="width:100%">
    </div>
    <div class="mySlides">
      <div class="numbertext">5 / 7</div>
      <img src="images/train.avif" style="width:100%">
    </div>
    <div class="mySlides">
      <div class="numbertext">6 / 7</div>
      <img src="images/city.jpg" style="width:100%">
    </div>
    <div class="mySlides">
      <div class="numbertext">7 / 7</div>
      <img src="images/travel-destinations.jpeg" style="width:100%">
    </div>

    <!-- Next/Prev -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <!-- Caption -->
    <div class="caption-container">
      <p id="caption"></p>
    </div>



    <!-- Thumbnails -->
<div class="column-container">
      <div class="column">
        <img class="demo cursor" src="images/beach_sunset.avif" onclick="currentSlide(1)" alt="Beach">
      </div>

      <div class="column">
        <img class="demo cursor" src="images/city_skyline.jpg" onclick="currentSlide(2)" alt="City">
      </div>

      <div class="column">
        <img class="demo cursor" src="images/mountain-view.jpg" onclick="currentSlide(3)" alt="Mountains">
      </div>

      <div class="column">
        <img class="demo cursor" src="images/national.avif" onclick="currentSlide(4)" alt="Road">
      </div>
      <div class="column">
        <img class="demo cursor" src="images/train.avif" onclick="currentSlide(5)" alt="Train">
      </div>
      <div class="column">
        <img class="demo cursor" src="images/city.jpg" onclick="currentSlide(6)" alt="City">
      </div>
      <div class="column">
        <img class="demo cursor" src="images/travel-destinations.jpeg" onclick="currentSlide(7)" alt="Ocean">
      </div>
</div>
  </div>
</div>


<!-- VIDEO SECTION -->
<section id="video">
    <h2>Travel Video</h2>
   
   <a href="https://youtu.be/afKf6WAzfCo?si=sEXTitpAsOPJnnSW" class="video-thumbnail">
    <img src="./images/travel_.jpg" alt="Travel video thumbnail">
    <p>Watch this travel video on YouTube</p>
</a>
</section>


<!-- CONTACT FORM -->
<section id="contact">
    <h2>Contact Us</h2>
    <form>
        <input type="text" placeholder="Your Name"><br>
        <input type="email" placeholder="Your Email"><br>
        <textarea placeholder="Your Message"></textarea><br>
        <input type="submit" value="Send Message">
    </form>
</section>

<!-- FOOTER -->
<footer>
    <p>2026 Travel Adventures | Designed by Me</p>
</footer>

<script src="./JS/one_page_website.js"></script>
</body>
</html>
